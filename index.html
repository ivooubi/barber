<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FADE. · Reserva tu cita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#8A8A8E;
  --line:#E5E5EA; --accent:#007AFF; --accent-soft:#EAF3FF; --danger:#FF3B30; --ok:#34C759;
  --shadow:0 8px 24px rgba(0,0,0,.06);
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --text:#F2F2F2; --sub:#98989D;
  --line:#38383A; --accent:#0A84FF; --accent-soft:#0A2A44; --danger:#FF453A; --ok:#30D158;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;position:sticky;top:0;backdrop-filter:blur(20px);background:color-mix(in srgb, var(--bg) 80%, transparent);z-index:10;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;letter-spacing:-.02em}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;transition:.3s}
.switch.on{background:var(--ok)}
.switch::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on::after{left:22px}
main{max-width:520px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--sub);font-size:15px;margin:0 0 22px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
label:first-child{margin-top:0}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.opt{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:.2s;position:relative}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .name{font-weight:600;font-size:15px}
.opt .price{color:var(--sub);font-size:13px;margin-top:2px}
.opt.sel .price{color:var(--accent)}
.pay{display:flex;gap:8px;margin-top:4px}
.pay .opt{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:56px}
#cardFields{margin-top:14px;display:none}

/* Selector de fecha/hora a medida (mismo lenguaje visual que el resto) */
.cal-wrap{position:relative}
.field{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}
.field.placeholder{color:var(--sub)}
.cal-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;z-index:20;border:1px solid var(--line)}
.cal-panel.open{display:block}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:15px}
.cal-head button{background:none;border:none;color:var(--accent);font-size:20px;cursor:pointer;padding:2px 10px;border-radius:8px}
.cal-head button:hover{background:var(--accent-soft)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--sub);margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;font-size:14px}
.cal-day:hover{background:var(--accent-soft)}
.cal-day.sel{background:var(--accent);color:#fff}
.cal-day.disabled{color:var(--line);cursor:default;pointer-events:none}
.cal-day.empty{visibility:hidden;cursor:default}
.cal-times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;max-height:150px;overflow-y:auto}
.time-chip{text-align:center;padding:8px 0;border-radius:10px;border:1px solid var(--line);font-size:13px;cursor:pointer}
.time-chip:hover{border-color:var(--accent)}
.time-chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}

.total{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 4px;font-size:16px;font-weight:600;border-top:1px solid var(--line);margin-top:16px}
.total span:last-child{color:var(--accent);font-size:20px}
button.cta{width:100%;padding:16px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;margin-top:18px;cursor:pointer;transition:opacity .2s}
button.cta:active{opacity:.7}
button.cta:disabled{opacity:.5;cursor:not-allowed}
#msg{text-align:center;font-size:14px;margin-top:12px;font-weight:600;display:none}
#msg.ok{color:var(--ok);display:block}
#msg.err{color:var(--danger);display:block}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="brand">FADE.</div>
  <div class="switch" id="themeSwitch" onclick="toggleTheme()"></div>
</header>

<main>
  <h1>Reserva tu cita</h1>
  <p class="sub">Elige tu corte, tu horario y cómo prefieres pagar.</p>

  <form class="card" id="form">
    <label>Nombre completo</label>
    <input id="nombre" required placeholder="Tu nombre">

    <div class="grid2">
      <div><label>Teléfono</label><input id="telefono" required placeholder="600 000 000"></div>
      <div><label>Correo electrónico</label><input id="email" type="email" required placeholder="tucorreo@gmail.com"></div>
    </div>

    <label>Fecha y hora</label>
    <div class="cal-wrap">
      <div class="field placeholder" id="dateField" onclick="toggleCal(event)">
        <span id="dateDisplay">Selecciona fecha y hora</span>
      </div>
      <div class="cal-panel" id="calPanel">
        <div class="cal-head">
          <button type="button" onclick="changeMonth(-1)">‹</button>
          <span id="calMonthLabel"></span>
          <button type="button" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-times" id="calTimes"></div>
      </div>
    </div>

    <label>Tipo de corte</label>
    <div class="options" id="cortes">
      <div class="opt" data-corte="Degradado" data-precio="15">
        <div class="name">Degradado</div><div class="price">15 €</div></div>
      <div class="opt" data-corte="Corte clásico" data-precio="12">
        <div class="name">Corte clásico</div><div class="price">12 €</div></div>
      <div class="opt" data-corte="Mullet" data-precio="18">
        <div class="name">Mullet</div><div class="price">18 €</div></div>
      <div class="opt" data-corte="Rapado" data-precio="10">
        <div class="name">Rapado</div><div class="price">10 €</div></div>
    </div>

    <label>Método de pago</label>
    <div class="pay" id="pagos">
      <div class="opt" data-pago="local"><div class="name">En el local</div></div>
      <div class="opt" data-pago="tarjeta"><div class="name">Tarjeta</div></div>
    </div>

    <div id="cardFields">
      <label>Número de tarjeta</label><input id="cardNum" placeholder="0000 0000 0000 0000" maxlength="19">
      <div class="grid2">
        <div><label>Caducidad</label><input id="cardExp" placeholder="MM/AA" maxlength="5"></div>
        <div><label>CVV</label><input id="cardCvv" placeholder="123" maxlength="3"></div>
      </div>
    </div>

    <div class="total"><span>Total</span><span id="totalPrecio">— €</span></div>
    <button class="cta" id="submitBtn" type="submit" disabled>Confirmar cita</button>
    <div id="msg"></div>
  </form>
  <footer>FADE. Peluquería · Gestión de citas</footer>
</main>

<script>
/* ====== SUPABASE ====== */
const SUPABASE_URL = "https://mbmkxeedxbfxgdhrpiol.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_guPyN5b-kVxUFY38mWWI9A_-5hEAYhV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ====== TEMA ====== */
const root = document.documentElement;
const sw = document.getElementById('themeSwitch');
function applyTheme(t){ root.setAttribute('data-theme', t); sw.classList.toggle('on', t==='dark'); localStorage.setItem('theme', t); }
applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
function toggleTheme(){ applyTheme(root.getAttribute('data-theme')==='dark' ? 'light':'dark'); }

/* ====== SELECTOR DE FECHA/HORA A MEDIDA ====== */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let viewDate = new Date(); viewDate.setDate(1);
let selDay=null, selTime=null, fechaCitaISO=null;
const calPanel=document.getElementById('calPanel'), dateField=document.getElementById('dateField'), dateDisplay=document.getElementById('dateDisplay');

function toggleCal(e){ e.stopPropagation(); const open=calPanel.classList.toggle('open'); if(open) renderCal(); }
document.addEventListener('click', (e)=>{ if(!e.target.closest('.cal-wrap')) calPanel.classList.remove('open'); });

function changeMonth(d){ viewDate.setMonth(viewDate.getMonth()+d); renderCal(); }

function renderCal(){
  document.getElementById('calMonthLabel').textContent = MESES[viewDate.getMonth()]+' '+viewDate.getFullYear();
  const grid=document.getElementById('calGrid'); grid.innerHTML='';
  const first=new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<startDow;i++){ const e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const cellDate=new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    const el=document.createElement('div'); el.className='cal-day'; el.textContent=d;
    if(cellDate<today) el.classList.add('disabled');
    if(selDay && cellDate.getTime()===selDay.getTime()) el.classList.add('sel');
    el.onclick=()=>{ selDay=cellDate; renderCal(); };
    grid.appendChild(el);
  }
  renderTimes();
}

function renderTimes(){
  const wrap=document.getElementById('calTimes'); wrap.innerHTML='';
  for(let h=10; h<20; h++){
    ['00','30'].forEach(m=>{
      const t=String(h).padStart(2,'0')+':'+m;
      const c=document.createElement('div'); c.className='time-chip'+(selTime===t?' sel':''); c.textContent=t;
      c.onclick=(ev)=>{ ev.stopPropagation(); selTime=t; confirmDate(); };
      wrap.appendChild(c);
    });
  }
}

function confirmDate(){
  if(!selDay || !selTime) return;
  const [hh,mm]=selTime.split(':');
  const full=new Date(selDay); full.setHours(Number(hh),Number(mm),0,0);
  fechaCitaISO=full.toISOString();
  dateDisplay.textContent = selDay.getDate()+' de '+MESES[selDay.getMonth()]+', '+selTime;
  dateField.classList.remove('placeholder');
  calPanel.classList.remove('open');
  check();
}

/* ====== SELECCIÓN DE CORTE ====== */
let corte=null, precio=0, pago=null;
document.querySelectorAll('#cortes .opt').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('#cortes .opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  corte=el.dataset.corte; precio=Number(el.dataset.precio);
  document.getElementById('totalPrecio').textContent = precio + ' €';
  check();
});

/* ====== SELECCIÓN DE PAGO ====== */
document.querySelectorAll('#pagos .opt').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('#pagos .opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  pago=el.dataset.pago;
  document.getElementById('cardFields').style.display = pago==='tarjeta' ? 'block':'none';
  check();
});

function check(){
  document.getElementById('submitBtn').disabled = !(corte && pago && fechaCitaISO);
}

/* ====== ENVÍO ====== */
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  await guardarCita(pago==='tarjeta' ? 'pagado' : 'pendiente en local');
});

async function guardarCita(estadoPago){
  const msg=document.getElementById('msg'); const btn=document.getElementById('submitBtn');
  btn.disabled=true;
  const { error } = await sb.from('citas').insert({
    nombre: document.getElementById('nombre').value,
    telefono: document.getElementById('telefono').value,
    email: document.getElementById('email').value,
    fecha_cita: fechaCitaISO,
    tipo_corte: corte,
    precio: precio,
    metodo_pago: pago,
    estado_pago: estadoPago
  });
  if(error){
    msg.textContent='No se pudo guardar la cita. Inténtalo de nuevo.';
    msg.className='err'; btn.disabled=false;
  } else {
    msg.textContent='¡Cita confirmada! Te esperamos.';
    msg.className='ok';
    document.getElementById('form').reset();
    document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    document.getElementById('cardFields').style.display='none';
    corte=null; pago=null; selDay=null; selTime=null; fechaCitaISO=null;
    dateDisplay.textContent='Selecciona fecha y hora';
    dateField.classList.add('placeholder');
    document.getElementById('totalPrecio').textContent='— €';
  }
}
</script>
</body>
</html>
